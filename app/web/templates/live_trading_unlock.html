    <script>
        (() => {
            const storageKey = "worthward:theme-mode";
            try {
                const storage = window.WORTHWARD_STORAGE?.local || window.localStorage;
                const storedMode = storage.getItem(storageKey)
                    ?? storage.getItem("antigravity:theme-mode");
                const mode = storedMode === "light" || storedMode === "dark" ? storedMode : "system";
                document.documentElement.dataset.themeMode = mode;
                if (mode === "system") document.documentElement.removeAttribute("data-theme-override");
                else document.documentElement.setAttribute("data-theme-override", mode);
            } catch (_error) {
                document.documentElement.dataset.themeMode = "system";
            }
        })();
    </script>

<body>
    <main class="workspace-modal-overlay live-trading-pin-overlay" role="presentation">
        <section class="workspace-modal-dialog live-trading-pin-dialog" role="dialog" aria-modal="true" aria-labelledby="live_trading_pin_title" aria-describedby="live_trading_pin_copy">
            <a class="dismiss-button workspace-modal-close" href="/trade/investment" aria-label="Back to investment">
                <span class="icon icon-dismiss-control" aria-hidden="true"></span>
            </a>
            <header class="live-trading-pin-heading">
                <span class="icon live-trading-pin-icon" aria-hidden="true"></span>
                <h1 class="live-trading-pin-title" id="live_trading_pin_title">Unlock Live trading</h1>
            </header>
            <p class="live-trading-pin-copy" id="live_trading_pin_copy">Enter the 6-digit PIN to open account data and live order controls.</p>
            <form class="live-trading-pin-form" method="post" action="/trade/live-trading/unlock" id="live_trading_pin_form">
                <label class="live-trading-pin-field" for="live_trading_pin" aria-label="6-digit PIN">
                    <input class="live-trading-pin-native-input"
                           id="live_trading_pin"
                           name="pin"
                           type="password"
                           inputmode="numeric"
                           pattern="[0-9]{6}"
                           minlength="6"
                           maxlength="6"
                           autocomplete="one-time-code"
                           autofocus
                           required>
                    {% for _ in range(6) %}<span class="live-trading-pin-slot" aria-hidden="true"></span>{% endfor %}
                </label>
                {% if error_message %}<p class="live-trading-pin-error" role="alert">{{ error_message }}</p>{% endif %}
                <div class="live-trading-pin-actions">
                    <button class="live-trading-pin-button" id="live_trading_pin_submit" type="submit" disabled>Unlock</button>
                </div>
            </form>
        </section>
    </main>
<script>
    (() => {
        const input = document.getElementById("live_trading_pin");
        const submit = document.getElementById("live_trading_pin_submit");
        const slots = Array.from(document.querySelectorAll(".live-trading-pin-slot"));
        if (!(input instanceof HTMLInputElement) || !(submit instanceof HTMLButtonElement)) return;

        const sync = () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 6);
            slots.forEach((slot, index) => {
                const filled = index < input.value.length;
                slot.classList.toggle("is-filled", filled);
            });
            submit.disabled = input.value.length !== 6;
        };

        input.addEventListener("input", sync);
        input.addEventListener("change", sync);
        sync();
    })();
</script>
</body>

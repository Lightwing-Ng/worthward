{% if strategy_form_fields %}
<div class="trade-strategy-params-grid" data-trade-strategy-params-grid>
    {% for field in strategy_form_fields %}
    <div class="trade-strategy-param" data-strategy-param-key="{{ field.key }}" data-strategy-param-kind="{{ field.kind }}">
        {% if field.field_type == "number" %}
        <label for="strategy_param_{{ field.key }}">{{ field.label }}</label>
        <div class="trade-strategy-number-field">
            <div class="trade-strategy-number-row">
                <input
                    id="strategy_param_{{ field.key }}"
                    name="{{ field.key }}"
                    class="trade-strategy-number-input"
                    data-strategy-param-input="number"
                    type="number"
                    inputmode="{{ field.input_mode }}"
                    value="{{ field.value }}"
                    {% if field.minimum is not none %}min="{{ field.minimum }}"{% endif %}
                    {% if field.maximum is not none %}max="{{ field.maximum }}"{% endif %}
                    {% if field.step is not none %}step="{{ field.step }}"{% endif %}
                    {% if field.help_text %}title="{{ field.help_text }}"{% endif %}
                >
            </div>
            <div class="trade-strategy-slider-shell" aria-hidden="true">
                <input
                    class="portfolio-weight-slider"
                    data-strategy-param-slider
                    type="range"
                    min="{{ field.slider_min }}"
                    max="{{ field.slider_max }}"
                    step="{{ field.slider_step }}"
                    value="{{ field.value }}"
                >
            </div>
        </div>
        {% elif field.field_type == "switch" %}
        <label class="switch-row trade-strategy-boolean-row" for="strategy_param_{{ field.key }}_switch">
            <span class="switch-label">{{ field.label }}</span>
            <span class="ios-switch-shell">
                <input
                    id="strategy_param_{{ field.key }}_switch"
                    type="checkbox"
                    data-strategy-param-switch
                    {% if field.switch_checked %}checked{% endif %}
                    {% if field.help_text %}title="{{ field.help_text }}"{% endif %}
                >
                <span class="ios-switch-slider" aria-hidden="true"></span>
            </span>
        </label>
        <input
            type="hidden"
            name="{{ field.key }}"
            value="{{ field.switch_on_value if field.switch_checked else field.switch_off_value }}"
            data-strategy-param-input="boolean"
            data-switch-on-value="{{ field.switch_on_value }}"
            data-switch-off-value="{{ field.switch_off_value }}"
        >
        {% elif field.field_type == "text" %}
        <label for="strategy_param_{{ field.key }}">{{ field.label }}</label>
        <div class="strategy-param-text-control">
            <input
                id="strategy_param_{{ field.key }}"
                name="{{ field.key }}"
                data-strategy-param-input="text"
                type="text"
                value="{{ field.value }}"
                {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
                {% if field.help_text %}title="{{ field.help_text }}"{% endif %}
            >
        </div>
        {% else %}
        <label for="strategy_param_{{ field.key }}">{{ field.label }}</label>
        <select
            id="strategy_param_{{ field.key }}"
            name="{{ field.key }}"
            class="trade-strategy-param-select form-select"
            data-strategy-param-input="select"
            {% if field.help_text %}title="{{ field.help_text }}"{% endif %}
        >
            {% for option in field.options %}
            <option value="{{ option }}" {% if option == field.value %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}

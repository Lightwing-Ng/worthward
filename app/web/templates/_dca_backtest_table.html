    <table class="settings-table trade-transactions-table scrollable-data-table investment-history-table backtest-history-table"
           data-table-header aria-label="Contribution details columns">
        <colgroup>
            <col style="width: var(--backtest-col-no-width);">
            <col style="width: var(--backtest-col-date-time-width);">
            <col style="width: var(--backtest-col-side-width);">
            <col style="width: var(--backtest-col-price-width);">
            <col style="width: var(--backtest-col-quantity-width);">
            <col style="width: var(--backtest-col-realized-pnl-width);">
            <col style="width: var(--backtest-col-unrealized-pnl-width);">
            <col style="width: var(--backtest-col-cash-width);">
            <col style="width: var(--backtest-col-market-value-width);">
            <col style="width: var(--backtest-col-equity-width);">
        </colgroup>
        <thead>
        <tr>
            <th data-markdown-export-label="No.">No.</th>
            <th data-markdown-export-label="Date time">Date time</th>
            <th data-markdown-export-label="Side">Side</th>
            <th class="trade-transactions-number" data-markdown-export-label="Price">Price</th>
            <th class="trade-transactions-number" data-markdown-export-label="Quantity">Quantity</th>
            <th class="trade-transactions-number" data-markdown-export-label="Realized P&amp;L">Realized P&amp;L</th>
            <th class="trade-transactions-number" data-markdown-export-label="Unrealized P&amp;L">Unrealized P&amp;L</th>
            <th class="trade-transactions-number" data-markdown-export-label="Cash">Cash</th>
            <th class="trade-transactions-number" data-markdown-export-label="Market value">Market value</th>
            <th class="trade-transactions-number" data-markdown-export-label="Equity">Equity</th>
        </tr>
        </thead>
    </table>
    <div class="trade-transactions-wrap scrollable-data-table-scroll investment-history-table-scroll"
         id="backtest_history_table_scroll" data-table-scroll>
        <table id="tradeTransactionsTable"
               class="settings-table trade-transactions-table scrollable-data-table investment-history-table backtest-history-table"
               data-table-body>
            <colgroup>
                <col style="width: var(--backtest-col-no-width);">
                <col style="width: var(--backtest-col-date-time-width);">
                <col style="width: var(--backtest-col-side-width);">
                <col style="width: var(--backtest-col-price-width);">
                <col style="width: var(--backtest-col-quantity-width);">
                <col style="width: var(--backtest-col-realized-pnl-width);">
                <col style="width: var(--backtest-col-unrealized-pnl-width);">
                <col style="width: var(--backtest-col-cash-width);">
                <col style="width: var(--backtest-col-market-value-width);">
                <col style="width: var(--backtest-col-equity-width);">
            </colgroup>
            <tbody></tbody>
        </table>
    </div>
<nav class="settings-pagination local-store-pagination local-store-pagination--floating trade-transactions-pagination"
     id="tradeTransactionsPagination" data-layout-role="pagination" aria-label="Contribution pages"
     aria-controls="tradeTransactionsTable" data-pagination-scroll-target="backtest_history_table_scroll" hidden>
</nav>

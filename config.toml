[app]
name = "antigravity"
version = "v2.52.2"
debug = false
updated_on = "19 Jul 2026"

[server]
host = "0.0.0.0"
port = 8688

[security]
# Temporary browser gate for the Live trading workspace. Override with the
# ANTIGRAVITY_LIVE_TRADING_PIN environment variable when needed.
live_trading_pin = "195135"

[network]
# Optional corporate CA PEM for Yahoo Finance. The ANTIGRAVITY_YAHOO_CA_PEM
# environment variable takes precedence over this value.
yahoo_ca_pem = ""

[persistence]
directory = "market_store"

[defaults]
ticker_a = "QQQ"
ticker_b = "JEPQ"
portfolio_tickers = ["NVDA", "AAPL", "QQQ"]
portfolio_weights = [25, 25, 50]
backtest_ticker = "QQQ"
dca_ticker = "QQQ"
dca_amount = 1000
dca_frequency = "monthly"
dca_weekday = 0
dca_month_day = 15
dca_include_dividends = false
backtest_strategy = "supertrend-ai"
backtest_capital = 10000
backtest_include_dividends = false
period = "1y"
range_mode = "period"
include_dividends = false
price_only = false

